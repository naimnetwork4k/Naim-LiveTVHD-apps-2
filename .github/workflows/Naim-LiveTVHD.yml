name: Build Android APK with Custom Logo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare workspace
        run: |
          if [ -d "Naim-LiveTVHD-apps-2-main" ] && [ ! -f "package.json" ]; then
            cp -rn Naim-LiveTVHD-apps-2-main/. . 2>/dev/null || true
          fi
          mkdir -p www

      - name: Install dependencies & Sync Capacitor
        run: |
          if [ -f "package.json" ]; then
            npm install
          else
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
          fi
          npx cap init "Naim LiveTVHD" "com.naimnetwork4k.livetvhd" --web-dir=www || true
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Splash Screen and Icons
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          ICON_SRC=""
          if [ -f "www/icon.jpg" ]; then
            ICON_SRC="www/icon.jpg"
          elif [ -f "www/1000273307 (1).png" ]; then
            ICON_SRC="www/1000273307 (1).png"
          fi
          if [ -n "$ICON_SRC" ]; then
            cp "$ICON_SRC" android/app/src/main/res/drawable/splash.jpg || true
            cp "$ICON_SRC" android/app/src/main/res/mipmap-hdpi/ic_launcher.jpg || true
            cp "$ICON_SRC" android/app/src/main/res/mipmap-mdpi/ic_launcher.jpg || true
            cp "$ICON_SRC" android/app/src/main/res/mipmap-xhdpi/ic_launcher.jpg || true
            cp "$ICON_SRC" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.jpg || true
            cp "$ICON_SRC" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg || true
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naim-LiveTVHD-Large-Splash
          path: android/app/build/outputs/apk/debug/app-debug.apk
