name: Build Android APK with Custom Logo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Initialize Capacitor
        run: |
          npm install
          npx cap init "Naim LiveTVHD" "com.naimnetwork4k.livetvhd" --web-dir=www || true
          npx cap add android || true
          npx cap sync android

      - name: Setup Splash Screen and Icons
        run: |
          mkdir -p www android/app/src/main/res/drawable android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          if [ -f "www/icon.jpg" ]; then
            cp "www/icon.jpg" android/app/src/main/res/drawable/splash.jpg || true
            cp "www/icon.jpg" android/app/src/main/res/mipmap-hdpi/ic_launcher.jpg || true
            cp "www/icon.jpg" android/app/src/main/res/mipmap-mdpi/ic_launcher.jpg || true
            cp "www/icon.jpg" android/app/src/main/res/mipmap-xhdpi/ic_launcher.jpg || true
            cp "www/icon.jpg" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.jpg || true
            cp "www/icon.jpg" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg || true
          fi

      - name: Enable Cleartext Traffic & Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naim-LiveTVHD-Large-Splash
          path: android/app/build/outputs/apk/debug/app-debug.apk
